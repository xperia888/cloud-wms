name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 编译 + 单元 / 集成测试（Testcontainers 使用 runner 自带的 Docker）
  build:
    name: mvn verify + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: wms
          POSTGRES_DB: wms
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U wms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

      # 用打好的 jar 以 dev 配置真实启动系统，走一遍控制台网页用到的全部接口
      - name: Start application (dev profile)
        run: |
          nohup java -jar target/wms-core-0.1.0-SNAPSHOT.jar --spring.profiles.active=dev > app.log 2>&1 &

      - name: Smoke test (console page + full parcel flow over HTTP)
        run: tools/smoke_test.sh http://localhost:8080

      - name: Application log
        if: always()
        run: tail -n 200 app.log || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore

  # 迁移脚本 + 测试数据在干净的 PostgreSQL 上执行，并回放 Java 中的 SQL（tools/*.py）
  sql-checks:
    name: SQL migrations & replay checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wms
          POSTGRES_PASSWORD: wms
          POSTGRES_DB: wms
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd "pg_isready -U wms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: wms
      PGPASSWORD: wms
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install psycopg2
        run: pip install psycopg2-binary

      - name: Apply migrations (wms) and migrations + dev seed (wms_dev)
        run: |
          set -e
          for f in $(ls src/main/resources/db/migration/V*.sql | sort -V); do
            psql -d wms -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql -d wms -qc "CREATE DATABASE wms_dev"
          for f in $(ls src/main/resources/db/migration/V*.sql | sort -V) $(ls src/main/resources/db/dev/V*.sql | sort -V); do
            psql -d wms_dev -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql -d wms_dev -c "SELECT count(*) AS reconcile_diffs FROM v_inventory_reconcile"

      - name: Inventory engine SQL replay
        run: python3 tools/verify_sql.py src/main/java/com/cloudwms

      - name: Outbound flow SQL replay
        run: python3 tools/verify_outbound.py src/main/java/com/cloudwms "dbname=wms_dev user=wms password=wms host=localhost"
