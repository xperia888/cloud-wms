spring:
  application:
    name: wms-core
  datasource:
    url: ${WMS_DB_URL:jdbc:postgresql://localhost:5432/wms}
    username: ${WMS_DB_USER:wms}
    password: ${WMS_DB_PASSWORD:wms}
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${WMS_PORT:8080}

logging:
  level:
    com.cloudwms: INFO
